metadata:
  name: pth-facebookresearch-sam-vit-h
  namespace: cvat
  annotations:
    name: Segment Anything
    version: 2
    type: interactor
    spec:
    min_pos_points: 0
    min_neg_points: 0
    startswith_box_optional: true
    animated_gif: https://raw.githubusercontent.com/cvat-ai/cvat/develop/site/content/en/images/hrnet_example.gif
    help_message: The interactor allows to get a mask of an object using at least one positive, and any negative points inside it

spec:
  description: Interactive object segmentation with Segment-Anything
  runtime: 'python:3.10'
  handler: main:handler
  eventTimeout: 30s
  env:
    - name: PYTHONPATH
      value: /opt/nuclio/sam

  volumes:
    - volume:
        name: sam-weights
        hostPath:
          path: ${SAM_WEIGHTS_DIR}
          type: Directory
      volumeMount:
        name: sam-weights
        mountPath: /opt/weights/sam
        readOnly: true

  build:
    image: cvat.pth.facebookresearch.sam.vit_h:latest-gpu
    baseImage: ubuntu:22.04
    # Use preloaded build helpers instead of refreshing them from their registries.
    noBaseImagesPull: true

    directives:
      preCopy:
      # set NVIDIA container runtime settings
        - kind: ENV
          value: NVIDIA_VISIBLE_DEVICES=all
        - kind: ENV
          value: NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # disable interactive frontend
        - kind: ENV
          value: DEBIAN_FRONTEND=noninteractive
      # use NJU for Python packages, including pip's build dependencies
        - kind: ENV
          value: PIP_INDEX_URL=https://mirrors.nju.edu.cn/pypi/web/simple
      # set workdir
        - kind: WORKDIR
          value: /opt/nuclio/sam
      # bootstrap CA certificates from NJU using Ubuntu's signed HTTP repository
        - kind: RUN
          value: >-
            sed -i -E
            's@https?://(archive|security)\.ubuntu\.com/ubuntu/?@http://mirrors.nju.edu.cn/ubuntu/@g'
            /etc/apt/sources.list
        - kind: RUN
          value: >-
            apt-get -o APT::Update::Error-Mode=any update &&
            apt-get -y --no-install-recommends install ca-certificates &&
            sed -i 's@http://mirrors.nju.edu.cn/ubuntu/@https://mirrors.nju.edu.cn/ubuntu/@g' /etc/apt/sources.list &&
            rm -rf /var/lib/apt/lists/*
      # install basic deps
        - kind: RUN
          value: apt-get -o APT::Update::Error-Mode=any update && apt-get -y install curl git python3 python3-pip python-is-python3 ffmpeg libsm6 libxext6 && rm -rf /var/lib/apt/lists/*
      # install sam deps
        - kind: RUN
          value: pip3 install torch torchvision torchaudio pycocotools matplotlib onnxruntime onnx --no-cache-dir
      # install SAM from NJU's PyPI mirror instead of a direct GitHub checkout
        - kind: RUN
          value: pip3 install segment-anything --no-cache-dir

  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432 # 32MB
  resources:
    limits:
      nvidia.com/gpu: 1

  platform:
    attributes:
      restartPolicy:
        name: ${SAM_RESTART_POLICY}
        maximumRetryCount: 3
      mountMode: volume
